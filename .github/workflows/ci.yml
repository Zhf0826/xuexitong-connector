name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run repository self-check
        run: python -m unittest discover -s tests -v

      - name: Verify packaging layout
        run: |
          test -f SKILL.md
          test -f agents/openai.yaml
          test -f references/tools.md
          test -f references/troubleshooting.md
          python -m py_compile scripts/register_mcp.py scripts/check_env.py
